# Camera configs for HikVision MV-CU120-10UC with MVL-HF0628M-6MPE 1/1.8” 6mm 6MP FA LENS
# Resolution not set to maximum 1624*1240 to maintain stable fps
image_width: 1440 
image_height: 1080
camera_name: front_industrial_camera

# Calibrate the camera following these tutorials:
# https://flowus.cn/lihanchen/share/02a518a0-f1bb-47a5-8313-55f75bab21b5
# https://docs.ros.org/en/rolling/p/camera_calibration/doc/tutorial_mono.html
camera_matrix:
  rows: 3
  cols: 3
  data: [1388.338149, 0.000000, 710.710829,
        0.000000, 1387.437554, 589.952364,
        0.000000, 0.000000, 1.000000]
distortion_model: plumb_bob
distortion_coefficients:
  rows: 1
  cols: 5
  data: [-0.076741, 0.115113, 0.001273, 0.002150, 0.000000]
rectification_matrix:
  rows: 3
  cols: 3
  data: [1.000000, 0.000000, 0.000000,
        0.000000, 1.000000, 0.000000,
        0.000000, 0.000000, 1.000000]
projection_matrix:
  rows: 3
  cols: 4
  data: [1372.659785, 0.000000, 713.591981, 0.000000,
        0.000000, 1375.017732, 591.181056, 0.000000,
        0.000000, 0.000000, 1.000000, 0.000000]
