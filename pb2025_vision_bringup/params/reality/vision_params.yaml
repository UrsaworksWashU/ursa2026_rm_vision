hik_camera_ros2_driver:
  ros__parameters:
    use_sim_time: false
    camera_info_url: "package://pb2025_vision_bringup/params/reality/camera_info.yaml"
    pixel_format: "BayerRG8"        # Recommended Option: RGB8Packed, BayerRG8
    adc_bit_depth: "Bits_8"         # If using BayerRG8, adc_bit_depth must be Bits_8; otherwise, it can be Bits_8 or Bits_12
    use_sensor_data_qos: true
    camera_name: "front_industrial_camera"
    # frame_id: "optical_frame"     # If not set, it will be set as <camera_name>_optical_frame
    # camera_topic: "image"         # If not set, it will be set as <camera_name>/image

    # camera lens set to near max focus and min aperture(2.8)
    image_width: 1440               # Capture width in px (centered ROI). Lower res -> lower latency/fps load
    image_height: 1080              # Capture height in px (centered ROI)
    acquisition_frame_rate: 90.0   # Unit: Hz
    exposure_time: 1200             # Unit: us
    gain: 11.0                     # Range: 0.0 ~ 16.9, Unit: dB

armor_detector_opencv:
  ros__parameters:
    use_sim_time: false
    debug: true
    camera_name: "front_industrial_camera"

    detect_color: 0
    binary_thres: 80

    light.min_ratio: 0.07
    armor.min_light_ratio: 0.8

    classifier_threshold: 0.25
    ignore_classes: ["negative"]

armor_detector_openvino:
  ros__parameters:
    use_sim_time: false
    use_sensor_data_qos: true
    debug_mode: false
    detect_color: 0

    detector:
      camera_name: "front_industrial_camera"
      subscribe_compressed: false

      # Model
      model_path: $(find-pkg-share pb2025_vision_bringup)/model/opt-1208-001.onnx
      device_type: "AUTO"
      confidence_threshold: 0.25
      top_k: 128
      nms_threshold: 0.3

armor_tracker:
  ros__parameters:
    use_sim_time: false
    target_frame: odom
    max_armor_distance: 10.0

    ekf:
      sigma2_q_xyz: 0.05
      sigma2_q_yaw: 5.0
      sigma2_q_r: 80.0

      r_xyz_factor: 0.0004
      r_yaw: 0.003

    tracker:
      max_match_distance: 0.5
      max_match_yaw_diff: 1.0

      tracking_thres: 5
      lost_time_thres: 1.0

projectile_motion:
  ros__parameters:
    use_sim_time: false
    projectile:
      offset_pitch: 0.0
      offset_yaw: 0.0
      offset_time: 0.15
      initial_speed: 20.0
      target_frame: "gimbal_pitch_odom"         # shooter frame; lookupTransform(odom, this) gives current gimbal RPY
      target_topic: "tracker/target"
      gimbal_cmd_topic: "cmd_gimbal"
      shoot_cmd_topic: "cmd_shoot"
      solver_type: "gravity"                    # projectile solve method: gravity / gaf
      # friction: 0.001                         # Air resistance factor if use GAF solver
